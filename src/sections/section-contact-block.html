<section class="contact-block">
    <div class="container">
        <div class="contact-block__inner">
            <div class="contact-block__form-wrapper">
                <h2 class="contact-block__title">Send Us a Message</h2>
                <form action="#" class="contact-block__form">
                    <div class="contact-block__form-group">
                        <label for="name" class="contact-block__form-label">Full Name</label>
                        <input type="text" id="name" name="name" class="contact-block__form-input"
                            placeholder="Your full name" required>
                    </div>
                    <div class="contact-block__form-group">
                        <label for="name" class="contact-block__form-label">Email Address</label>
                        <input type="text" id="name" name="name" class="contact-block__form-input"
                            placeholder="your@email.com" required>
                    </div>
                    <div class="contact-block__form-group">
                        <label for="name" class="contact-block__form-label">Message</label>
                        <textarea name="message" id="message" class="contact-block__form-textarea"
                            placeholder="How can we help you?" required></textarea>
                    </div>
                    <button type="submit" class="contact-block__form-button btn primary">Send Message</button>
                </form>
            </div>
            <div class="contact-block__sidebar">
                <h2 class="contact-block__sidebar-title">Find Us</h2>
                <div class="contact-block__sidebar-items">
                    <div href="#" class="contact-block__sidebar-item">
                        <div href="#" class="contact-block__sidebar-item-icon">
                            <img src="/icons/icon-location.svg" alt="Location">
                        </div>
                        <div class="contact-block__sidebar-item-content">
                            <h3 class="contact-block__sidebar-item-title">Address</h3>
                            <p class="contact-block__sidebar-item-description">
                                Cancer Care Trust
                                <br>
                                Level 30, The Leadenhall Building
                                <br>
                                122 Leadenhall Street
                                <br>
                                London, EC3V 4AB
                            </p>
                        </div>
                    </div>
                    <div href="#" class="contact-block__sidebar-item">
                        <div href="#" class="contact-block__sidebar-item-icon">
                            <img src="/icons/icon-phone.svg" alt="Location">
                        </div>
                        <div class="contact-block__sidebar-item-content">
                            <h3 class="contact-block__sidebar-item-title">Telephone</h3>
                            <a href="tel:03003658400" class="contact-block__sidebar-item-link">0300 365 8400</a>
                        </div>
                    </div>
                    <div href="#" class="contact-block__sidebar-item">
                        <div href="#" class="contact-block__sidebar-item-icon">
                            <img src="/icons/icon-email.svg" alt="Location">
                        </div>
                        <div class="contact-block__sidebar-item-content">
                            <h3 class="contact-block__sidebar-item-title">Email</h3>
                            <a href="mailto:enquiries@cancercaretrust.org.uk"
                                class="contact-block__sidebar-item-link">enquiries@cancercaretrust.org.uk</a>
                        </div>
                    </div>
                </div>
                <div class="contact-block__sidebar-map">
                    <div href="#" class="contact-block__sidebar-map-icon">
                        <img src="/icons/icon-location.svg" alt="Location">
                    </div>
                    <h3 class="contact-block__sidebar-map-title">The Leadenhall Building, London</h3>
                    <a href="https://maps.app.goo.gl/KoqVjRjBwhCHuj5n7" target="_blank"
                        class="contact-block__sidebar-map-link">Open in Google Maps →</a>
                </div>
            </div>
        </div>
    </div>
</section>
