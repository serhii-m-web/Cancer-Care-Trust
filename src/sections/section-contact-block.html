<section class="contact-block" id="contact-block" aria-labelledby="contact-form-title">
  <div class="container">
    <div class="contact-block__inner">
      <div class="contact-block__form-wrapper" data-animate="fade-right">
        <h2 class="contact-block__title" id="contact-form-title">Send Us a Message</h2>
        <form action="#" class="contact-block__form">
          <div class="contact-block__form-group">
            <label for="contact-name" class="contact-block__form-label">Full Name</label>
            <input
              type="text"
              id="contact-name"
              name="name"
              class="contact-block__form-input"
              placeholder="Your full name"
              autocomplete="name"
              required
            />
          </div>
          <div class="contact-block__form-group">
            <label for="contact-email" class="contact-block__form-label">Email Address</label>
            <input
              type="email"
              id="contact-email"
              name="email"
              class="contact-block__form-input"
              placeholder="your@email.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="contact-block__form-group">
            <label for="contact-message" class="contact-block__form-label">Message</label>
            <textarea
              id="contact-message"
              name="message"
              class="contact-block__form-textarea"
              placeholder="How can we help you?"
              required
            ></textarea>
          </div>
          <button type="submit" class="contact-block__form-button btn primary">
            Send Message
          </button>
        </form>
      </div>
      <div class="contact-block__sidebar" data-animate="fade-left" data-animate-delay="120">
        <h2 class="contact-block__sidebar-title" id="contact-find-title">Find Us</h2>
        <div class="contact-block__sidebar-items">
          <div class="contact-block__sidebar-item">
            <div class="contact-block__sidebar-item-icon" aria-hidden="true">
              <img src="icons/icon-location.svg" alt="" />
            </div>
            <div class="contact-block__sidebar-item-content">
              <h3 class="contact-block__sidebar-item-title">Address</h3>
              <p class="contact-block__sidebar-item-description">
                Cancer Care Trust
                <br />
                Level 30, The Leadenhall Building
                <br />
                122 Leadenhall Street
                <br />
                London, EC3V 4AB
              </p>
            </div>
          </div>
          <div class="contact-block__sidebar-item">
            <div class="contact-block__sidebar-item-icon" aria-hidden="true">
              <img src="icons/icon-phone.svg" alt="" />
            </div>
            <div class="contact-block__sidebar-item-content">
              <h3 class="contact-block__sidebar-item-title">Telephone</h3>
              <a href="tel:+443003658400" class="contact-block__sidebar-item-link"
                >0300 365 8400</a
              >
            </div>
          </div>
          <div class="contact-block__sidebar-item">
            <div class="contact-block__sidebar-item-icon" aria-hidden="true">
              <img src="icons/icon-email.svg" alt="" />
            </div>
            <div class="contact-block__sidebar-item-content">
              <h3 class="contact-block__sidebar-item-title">Email</h3>
              <a
                href="mailto:enquiries@cancercaretrust.org.uk"
                class="contact-block__sidebar-item-link"
                >enquiries@cancercaretrust.org.uk</a
              >
            </div>
          </div>
        </div>
        <div class="contact-block__sidebar-map">
          <div class="contact-block__sidebar-map-icon" aria-hidden="true">
            <img src="icons/icon-location.svg" alt="" />
          </div>
          <h3 class="contact-block__sidebar-map-title">The Leadenhall Building, London</h3>
          <a
            href="https://maps.app.goo.gl/KoqVjRjBwhCHuj5n7"
            target="_blank"
            rel="noopener noreferrer"
            class="contact-block__sidebar-map-link"
            >Open in Google Maps
            <span class="visually-hidden">(opens in a new tab)</span>
            <span aria-hidden="true"> →</span></a
          >
        </div>
      </div>
    </div>
  </div>
</section>
